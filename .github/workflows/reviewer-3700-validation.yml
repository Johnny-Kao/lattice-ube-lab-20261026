name: AWS-LC #3700 reviewer research validation
on:
  push:
    branches:
      - research/aws-lc-3700-review-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-variant:
    if: ${{ !contains(github.event.head_commit.message, '[bsd-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact PR head and make isolated variants
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/aws/aws-lc.git /tmp/aws-lc-head
          git -C /tmp/aws-lc-head checkout --detach 632e337448a5a9fd9b8e85df92b340c3797e8aaa
          test "$(git -C /tmp/aws-lc-head rev-parse HEAD)" = 632e337448a5a9fd9b8e85df92b340c3797e8aaa
          cp -a /tmp/aws-lc-head /tmp/aws-lc-review
          python3 research/reviewer_fgn_variant.py /tmp/aws-lc-review/crypto/ube/fork_ube_detect.c
          git -C /tmp/aws-lc-review diff --check
          git -C /tmp/aws-lc-review diff -- crypto/ube/fork_ube_detect.c | tee reviewer-diff.patch
          test "$(git -C /tmp/aws-lc-review diff --name-only)" = crypto/ube/fork_ube_detect.c
          for v in head review; do
            git -C "/tmp/aws-lc-$v" submodule update --init --recursive
          done
      - name: Build and run first-read regression on original and proposed variants
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results
          for v in head review; do
            cmake -S "/tmp/aws-lc-$v" -B "/tmp/aws-lc-$v-build" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_TESTING=ON -DDISABLE_GO=ON \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build "/tmp/aws-lc-$v-build" --target crypto --parallel 4
            clang++ -O2 -std=c++17 -pthread \
              -I"/tmp/aws-lc-$v/include" research/first_read_after_fork.cc \
              "/tmp/aws-lc-$v-build/crypto/libcrypto.a" \
              -ldl -lm -lrt -latomic -o "/tmp/first-read-$v"
            timeout --kill-after=3s 180s "/tmp/first-read-$v" 60 2>&1 | tee "results/first-read-$v.log"
          done
      - name: Official minimal suite on reviewer variant
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build /tmp/aws-lc-review-build --target run_minimal_tests --parallel 4 \
            2>&1 | tee results/minimal-review.log
      - name: Repeat direct fork-generation performance comparison
        shell: bash
        run: |
          set -euxo pipefail
          for v in head review; do
            clang++ -O3 -std=c++17 -pthread \
              -I"/tmp/aws-lc-$v/include" research/bench_rand_bytes.cc \
              "/tmp/aws-lc-$v-build/crypto/libcrypto.a" \
              -ldl -lm -lrt -latomic -o "/tmp/bench-$v"
          done
          python3 research/run_rand_bench.py \
            --baseline /tmp/bench-head --patched /tmp/bench-review \
            --mode fork --repeats 7 --out-dir results/fork-benchmark
          python3 research/run_rand_bench.py \
            --baseline /tmp/bench-head --patched /tmp/bench-review \
            --mode rand --repeats 7 --out-dir results/rand-benchmark
      - name: Exact-source differential and ThreadSanitizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results/differential
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for v in ("head", "review"):
              src = Path("/tmp/aws-lc-" + v)
              dst = Path("/tmp/aws-lc-tsan-" + v)
              shutil.copytree(src, dst)
              p = dst / "crypto/ube/fork_ube_detect.c"
              body = p.read_text()
              needle = "\n#elif defined(AWSLC_PLATFORM_DOES_NOT_FORK)"
              assert body.count(needle) == 1
              api = (
                  "\nuintptr_t AWSLC_test_fork_flag_address(void);"
                  "\nuintptr_t AWSLC_test_fork_flag_address(void) { return (uintptr_t)fork_detect_addr; }"
                  "\nsize_t AWSLC_test_fork_flag_width(void);"
                  "\nsize_t AWSLC_test_fork_flag_width(void) { return sizeof(*fork_detect_addr); }\n"
              )
              p.write_text(body.replace(needle, api + needle))
          PY
          for v in head review; do
            cmake -S "/tmp/aws-lc-tsan-$v" -B "/tmp/aws-lc-tsan-$v-build" -GNinja \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
            cmake --build "/tmp/aws-lc-tsan-$v-build" --target crypto --parallel 4
            clang++ -O1 -g -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/aws-lc-tsan-$v/include" research/kernel_wipe_differential.cc \
              "/tmp/aws-lc-tsan-$v-build/crypto/libcrypto.a" \
              -ldl -lm -lrt -latomic -o "/tmp/wipe-tsan-$v"
            clang++ -O2 -std=c++17 -pthread \
              -I"/tmp/aws-lc-tsan-$v/include" research/kernel_wipe_differential.cc \
              "/tmp/aws-lc-$v-build/crypto/libcrypto.a" \
              -ldl -lm -lrt -latomic -o "/tmp/wipe-native-$v"
            for case in "native 0 500" "native 2 150" "tsan 0 200" "tsan 2 70"; do
              read -r kind mode rounds <<<"$case"
              bin="/tmp/wipe-$kind-$v"
              if [ "$kind" = tsan ]; then
                TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 120s \
                  "$bin" "$rounds" "$mode" 4 \
                  >"results/differential/$v-$kind-$mode.log" 2>&1
              else
                timeout --kill-after=3s 120s "$bin" "$rounds" "$mode" 4 \
                  >"results/differential/$v-$kind-$mode.log" 2>&1
              fi
              grep -F "RESULT passed=$rounds/$rounds" "results/differential/$v-$kind-$mode.log"
              echo "PASS $v $kind mode=$mode rounds=$rounds" | tee -a results/differential/status.txt
            done
          done
          test "$(wc -l < results/differential/status.txt)" -eq 8
      - name: Paired CPU time peak RAM and throughput
        shell: bash
        run: |
          set -euxo pipefail
          python3 research/reviewer_resource_bench.py \
            --head /tmp/bench-head --review /tmp/bench-review \
            --out results/resource --repeats 7
          cat results/resource/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Summary and evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## AWS-LC #3700 reviewer research'
            echo 'Original PR head: 632e337448a5a9fd9b8e85df92b340c3797e8aaa'
            echo 'Proposed variant generated from research/reviewer_fgn_variant.py'
            for file in results/first-read-*.log; do
              if [ -f "$file" ]; then
                echo "### $file"
                tail -n 5 "$file"
              fi
            done
            for file in results/fork-benchmark/SUMMARY.md results/rand-benchmark/SUMMARY.md; do
              if [ -f "$file" ]; then cat "$file"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-lc-3700-reviewer-evidence
          path: |
            reviewer-diff.patch
            results/

  freebsd-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check same source on real FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          mem: 4096
          cpu: 3
          prepare: |
            pkg install -y cmake ninja git python3
          run: |
            set -eu
            freebsd-version
            uname -a
            sysctl hw.ncpu hw.physmem
            git clone --filter=blob:none https://github.com/aws/aws-lc.git /tmp/aws-bsd-head
            git -C /tmp/aws-bsd-head checkout --detach 632e337448a5a9fd9b8e85df92b340c3797e8aaa
            cp -R /tmp/aws-bsd-head /tmp/aws-bsd-review
            python3 research/reviewer_fgn_variant.py /tmp/aws-bsd-review/crypto/ube/fork_ube_detect.c
            for variant in head review; do
              git -C "/tmp/aws-bsd-$variant" submodule update --init --recursive
              cmake -S "/tmp/aws-bsd-$variant" -B "/tmp/aws-bsd-$variant-build" -GNinja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
                -DBUILD_TESTING=ON -DDISABLE_GO=ON
              cmake --build "/tmp/aws-bsd-$variant-build" --target crypto --parallel 3
              c++ -O2 -std=c++17 -pthread \
                -I"/tmp/aws-bsd-$variant/include" research/first_read_after_fork.cc \
                "/tmp/aws-bsd-$variant-build/crypto/libcrypto.a" \
                -o "/tmp/bsd-fork-$variant"
              "/tmp/bsd-fork-$variant" 30
              echo "BSD PASS $variant"
            done
