name: AWS-LC Staging exact-commit signoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner toolchain (no apt installation)
        run: |
          set -euxo pipefail
          command -v git
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v patch
          command -v python3
      - name: Pin REAL Staging commit and prepare baseline / pristine candidate
        shell: bash
        run: |
          set -euxo pipefail
          BASE_SHA=cd481c207e38f06aeb5766f4a1cdfce10a4c0af8
          STAGING_SHA=9eec7b1ecf121ff341ffee60589e167961a90e27
          STAGING_REPO=https://github.com/Johnny-Kao/aws-lc-staging.git
          mkdir -p safety-results
          git clone --depth=2 --branch perf/fork-ube-atomic-fast-path "$STAGING_REPO" /tmp/awslc-patch
          test "$(git -C /tmp/awslc-patch rev-parse HEAD)" = "$STAGING_SHA"
          git clone --depth=1 https://github.com/aws/aws-lc.git /tmp/awslc-base
          git -C /tmp/awslc-base fetch --depth=1 origin "$BASE_SHA"
          git -C /tmp/awslc-base checkout --detach "$BASE_SHA"
          git -C /tmp/awslc-base submodule update --init --recursive
          git -C /tmp/awslc-patch submodule update --init --recursive
          test "$(git -C /tmp/awslc-patch rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C /tmp/awslc-patch diff --name-only HEAD^ HEAD)" = "crypto/ube/fork_ube_detect.c"
          test -z "$(git -C /tmp/awslc-patch status --porcelain)"
          {
            echo "upstream=$BASE_SHA"
            echo "staging=$STAGING_SHA"
            echo "staging_repo=$STAGING_REPO"
            echo "staging_branch=perf/fork-ube-atomic-fast-path"
            git -C /tmp/awslc-patch diff --stat HEAD^ HEAD
            git -C /tmp/awslc-patch show --format=fuller --no-patch "$STAGING_SHA"
          } | tee safety-results/SOURCE_PROVENANCE.txt
          # Preserve pristine Staging source for official upstream tests.
          cp -a /tmp/awslc-patch /tmp/awslc-patch-clean
          # Test-only symbol is injected into the differential build trees ONLY.
          # Production Staging sources and the upstream suite stay untouched.
          python3 - <<'PY'
          from pathlib import Path
          for variant in ("base", "patch"):
              p = Path(f"/tmp/awslc-{variant}/crypto/ube/fork_ube_detect.c")
              data = p.read_text()
              needle = "\n#elif defined(AWSLC_PLATFORM_DOES_NOT_FORK)"
              assert data.count(needle) == 1
              data = data.replace(needle, "\nuintptr_t AWSLC_test_fork_flag_address(void);\nuintptr_t AWSLC_test_fork_flag_address(void) { return (uintptr_t)fork_detect_addr; }\nsize_t AWSLC_test_fork_flag_width(void);\nsize_t AWSLC_test_fork_flag_width(void) { return sizeof(*fork_detect_addr); }\n" + needle)
              p.write_text(data)
          PY
          for variant in base patch; do
            cmake -S "/tmp/awslc-$variant" -B "/tmp/awslc-$variant-build" -GNinja \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON \
              -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
            cmake --build "/tmp/awslc-$variant-build" --target crypto --parallel "$(nproc)"
            cmake -S "/tmp/awslc-$variant" -B "/tmp/awslc-$variant-native" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build "/tmp/awslc-$variant-native" --target crypto --parallel "$(nproc)"
          done
      - name: Verify official-test source is pristine
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(git -C /tmp/awslc-patch-clean status --porcelain)"
          test "$(git -C /tmp/awslc-patch-clean rev-parse HEAD)" = "9eec7b1ecf121ff341ffee60589e167961a90e27"
      - name: Differential atomic and fork scenarios — always capture both
        shell: bash
        run: |
          mkdir -p safety-results
          set +e
          for variant in base patch; do
            lib="/tmp/awslc-$variant-build/crypto/libcrypto.a"
            clang++ -g -O1 -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/awslc-$variant/include" research/fork_generation_concurrency.cc "$lib" \
              -ldl -lm -lrt -latomic -o "/tmp/check-$variant" \
              >"safety-results/compile-$variant.log" 2>&1
            compile_rc=$?
            if [ "$compile_rc" -eq 0 ]; then
              TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 45s \
                "/tmp/check-$variant" 30 >"safety-results/run-$variant.log" 2>&1
              test_rc=$?
            else
              test_rc=125
            fi
            echo "$variant compile=$compile_rc run=$test_rc" | tee -a safety-results/status.txt
          done
          exit 0

      - name: Full behavior differential — generation / RAND / TSan
        shell: bash
        run: |
          set +e
          mkdir -p safety-results
          failures=0
          for variant in base patch; do
            if [ "$variant" = "base" ]; then expected_width=1; else expected_width=4; fi
            native="/tmp/awslc-$variant-native/crypto/libcrypto.a"
            clang++ -g -O2 -std=c++17 -pthread -rdynamic \
              -I"/tmp/awslc-$variant/include" research/kernel_wipe_differential.cc "$native" \
              -ldl -lm -lrt -latomic -o "/tmp/wipe-native-$variant" \
              >"safety-results/compile-native-$variant.log" 2>&1
            native_build=$?
            for mode in 0 2; do
              if [ "$mode" -eq 0 ]; then rounds=500; label=generation; else rounds=150; label=cooperative-rand; fi
              if [ "$native_build" -eq 0 ]; then
                timeout --kill-after=3s 90s "/tmp/wipe-native-$variant" "$rounds" "$mode" "$expected_width" \
                  >"safety-results/$label-$variant.log" 2>&1
                result=$?
              else
                result=125
              fi
              echo "$variant $label compile=$native_build run=$result" | tee -a safety-results/signoff-status.txt
              if [ "$result" -ne 0 ]; then failures=$((failures+1)); fi
            done
            tsan="/tmp/awslc-$variant-build/crypto/libcrypto.a"
            clang++ -g -O1 -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/awslc-$variant/include" research/kernel_wipe_differential.cc "$tsan" \
              -ldl -lm -lrt -latomic -o "/tmp/wipe-tsan-$variant" \
              >"safety-results/compile-tsan-$variant.log" 2>&1
            tsan_build=$?
            for mode in 0 2; do
              if [ "$mode" -eq 0 ]; then rounds=200; label=tsan-generation; else rounds=70; label=tsan-cooperative-rand; fi
              if [ "$tsan_build" -eq 0 ]; then
                TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 90s \
                  "/tmp/wipe-tsan-$variant" "$rounds" "$mode" "$expected_width" \
                  >"safety-results/$label-$variant.log" 2>&1
                result=$?
              else
                result=125
              fi
              echo "$variant $label compile=$tsan_build run=$result" | tee -a safety-results/signoff-status.txt
              if [ "$result" -ne 0 ]; then failures=$((failures+1)); fi
            done
          done
          echo "failures=$failures" | tee -a safety-results/signoff-status.txt
          exit "$((failures>0))"
      - name: Official AWS-LC Minimal + Go on PRISTINE Staging SHA
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p safety-results
          test -z "$(git -C /tmp/awslc-patch-clean status --porcelain)"
          cmake -S /tmp/awslc-patch-clean -B /tmp/awslc-stage-official -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON \
            -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build /tmp/awslc-stage-official --target run_minimal_tests \
            --parallel "$(nproc)" 2>&1 | tee safety-results/official-minimal.log
          cmake -S /tmp/awslc-patch-clean -B /tmp/awslc-stage-official -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON \
            -DDISABLE_GO=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build /tmp/awslc-stage-official --target run_tests \
            --parallel "$(nproc)" 2>&1 | tee safety-results/official-go.log
          echo "OFFICIAL_UPSTREAM=PASS STAGING_SHA=9eec7b1ecf121ff341ffee60589e167961a90e27" \
            | tee safety-results/official-status.txt
      - name: Paired Staging vs upstream performance — 7 repeated measurements
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p safety-results/benchmark
          for variant in base patch; do
            clang++ -O3 -std=c++17 -pthread \
              -I"/tmp/awslc-$variant/include" research/bench_rand_bytes.cc \
              "/tmp/awslc-$variant-native/crypto/libcrypto.a" \
              -ldl -lm -lrt -latomic -o "/tmp/bench-$variant"
          done
          python3 research/run_rand_bench.py \
            --baseline /tmp/bench-base --patched /tmp/bench-patch \
            --mode rand --repeats 7 --out-dir safety-results/benchmark/rand
          python3 research/run_rand_bench.py \
            --baseline /tmp/bench-base --patched /tmp/bench-patch \
            --mode fork --repeats 7 --out-dir safety-results/benchmark/fork
          cat safety-results/benchmark/rand/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          cat safety-results/benchmark/fork/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Final strict gate and evidence manifest
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fx 'failures=0' safety-results/signoff-status.txt
          test "$(grep -Ec '^((base|patch) (generation|cooperative-rand|tsan-generation|tsan-cooperative-rand) compile=0 run=0)$' safety-results/signoff-status.txt)" -eq 8
          test "$(grep -Ec '^((base|patch) compile=0 run=0)$' safety-results/status.txt)" -eq 2
          grep -F 'OFFICIAL_UPSTREAM=PASS STAGING_SHA=9eec7b1ecf121ff341ffee60589e167961a90e27' safety-results/official-status.txt
          test -s safety-results/benchmark/rand/rand_benchmark.csv
          test -s safety-results/benchmark/fork/rand_benchmark.csv
          git -C /tmp/awslc-patch-clean status --porcelain | tee safety-results/clean-staging-status.txt
          test ! -s safety-results/clean-staging-status.txt
          echo 'STAGING_VERIFICATION=PASS' | tee safety-results/FINAL_GATE.txt
      - name: Collect compiler/OS and static memory-order evidence
        if: always()
        shell: bash
        run: |
          mkdir -p safety-results
          clang --version > safety-results/toolchain.txt
          uname -a >> safety-results/toolchain.txt
          rg -n 'atomic_|memory_order|fork_detect_addr|fgn|CRYPTO_STATIC_MUTEX' \
            /tmp/awslc-patch/crypto/ube/fork_ube_detect.c > safety-results/atomic-source-lines.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-safety-batch
          path: safety-results/
