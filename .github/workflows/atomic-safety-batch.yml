name: AWS-LC final atomic safety batch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner toolchain (no apt installation)
        run: |
          set -euxo pipefail
          command -v git
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          command -v patch
          command -v python3
      - name: Exact source and two sanitizer builds
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/aws/aws-lc.git /tmp/awslc-base
          git -C /tmp/awslc-base checkout --detach cd481c207e38f06aeb5766f4a1cdfce10a4c0af8
          git -C /tmp/awslc-base submodule update --init --recursive
          cp -a /tmp/awslc-base /tmp/awslc-patch
          cd /tmp/awslc-patch
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/research/atomic-fork-fastpath.patch"
          patch -p1 < "$GITHUB_WORKSPACE/research/atomic-fork-fastpath.patch"
          # Test-only symbol to locate the fork flag. Production logic unchanged.
          python3 - <<'PY'
          from pathlib import Path
          for variant in ("base", "patch"):
              p = Path(f"/tmp/awslc-{variant}/crypto/ube/fork_ube_detect.c")
              data = p.read_text()
              needle = "\n#elif defined(AWSLC_PLATFORM_DOES_NOT_FORK)"
              assert data.count(needle) == 1
              data = data.replace(needle, "\nuintptr_t AWSLC_test_fork_flag_address(void);\nuintptr_t AWSLC_test_fork_flag_address(void) { return (uintptr_t)fork_detect_addr; }\n" + needle)
              p.write_text(data)
          PY
          for variant in base patch; do
            cmake -S "/tmp/awslc-$variant" -B "/tmp/awslc-$variant-build" -GNinja \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON \
              -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
            cmake --build "/tmp/awslc-$variant-build" --target crypto --parallel "$(nproc)"
            cmake -S "/tmp/awslc-$variant" -B "/tmp/awslc-$variant-native" -GNinja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
              -DDISABLE_GO=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build "/tmp/awslc-$variant-native" --target crypto --parallel "$(nproc)"
          done
      - name: Differential atomic and fork scenarios — always capture both
        shell: bash
        run: |
          mkdir -p safety-results
          set +e
          for variant in base patch; do
            lib="/tmp/awslc-$variant-build/crypto/libcrypto.a"
            clang++ -g -O1 -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/awslc-$variant/include" research/fork_generation_concurrency.cc "$lib" \
              -ldl -lm -lrt -latomic -o "/tmp/check-$variant" \
              >"safety-results/compile-$variant.log" 2>&1
            compile_rc=$?
            if [ "$compile_rc" -eq 0 ]; then
              TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 45s \
                "/tmp/check-$variant" 30 >"safety-results/run-$variant.log" 2>&1
              test_rc=$?
            else
              test_rc=125
            fi
            echo "$variant compile=$compile_rc run=$test_rc" | tee -a safety-results/status.txt
          done
          exit 0
      - name: Active fork differential with child stage diagnostics
        shell: bash
        run: |
          mkdir -p safety-results
          set +e
          for variant in base patch; do
            lib="/tmp/awslc-$variant-build/crypto/libcrypto.a"
            clang++ -g -O1 -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/awslc-$variant/include" research/active_fork_diagnostic.cc "$lib" \
              -ldl -lm -lrt -latomic -o "/tmp/active-$variant" \
              >"safety-results/active-compile-$variant.log" 2>&1
            build_rc=$?
            if [ "$build_rc" -eq 0 ]; then
              TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 45s \
                "/tmp/active-$variant" 12 >"safety-results/active-run-$variant.log" 2>&1
              run_rc=$?
            else
              run_rc=125
            fi
            echo "$variant build=$build_rc run=$run_rc" | tee -a safety-results/active-status.txt
          done
          exit 0
      - name: Differential kernel-page reset and real active fork (all cases recorded)
        shell: bash
        run: |
          set +e
          mkdir -p safety-results
          failures=0
          for variant in base patch; do
            lib="/tmp/awslc-$variant-native/crypto/libcrypto.a"
            for kind in kernel_wipe_differential active_fork_diagnostic; do
              clang++ -O2 -std=c++17 -pthread -I"/tmp/awslc-$variant/include" \
                "research/${kind}.cc" "$lib" -ldl -lm -lrt -latomic \
                -o "/tmp/${kind}-$variant" >"safety-results/build-${kind}-$variant.log" 2>&1
              build_rc=$?
              if [ "$build_rc" -eq 0 ]; then
                case "$kind" in
                  kernel_wipe_differential) iters=500;;
                  active_fork_diagnostic) iters=20;;
                esac
                timeout --kill-after=3s 80s "/tmp/${kind}-$variant" "$iters" \
                  >"safety-results/${kind}-$variant.log" 2>&1
                run_rc=$?
              else
                run_rc=125
              fi
              echo "$variant $kind build=$build_rc run=$run_rc" | tee -a safety-results/differential-status.txt
              if [ "$run_rc" -ne 0 ]; then failures=$((failures+1)); fi
            done
            # Separately test RAND reseeding during external page reset.
            timeout --kill-after=3s 60s "/tmp/kernel_wipe_differential-$variant" 80 1 \
              >"safety-results/wipe-with-rand-$variant.log" 2>&1
            rand_rc=$?
            echo "$variant wipe-with-rand run=$rand_rc" | tee -a safety-results/differential-status.txt
            if [ "$rand_rc" -ne 0 ]; then failures=$((failures+1)); fi
            lib="/tmp/awslc-$variant-build/crypto/libcrypto.a"
            clang++ -g -O1 -std=c++17 -pthread -fsanitize=thread -fno-omit-frame-pointer \
              -I"/tmp/awslc-$variant/include" research/kernel_wipe_differential.cc "$lib" \
              -ldl -lm -lrt -latomic -o "/tmp/wipe-tsan-$variant" \
              >"safety-results/build-wipe-tsan-$variant.log" 2>&1
            build_rc=$?
            if [ "$build_rc" -eq 0 ]; then
              TSAN_OPTIONS="halt_on_error=1:exitcode=66" timeout --kill-after=3s 80s \
                "/tmp/wipe-tsan-$variant" 200 >"safety-results/wipe-tsan-$variant.log" 2>&1
              run_rc=$?
            else
              run_rc=125
            fi
            echo "$variant wipe-tsan build=$build_rc run=$run_rc" | tee -a safety-results/differential-status.txt
            if [ "$run_rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "failures=$failures" | tee -a safety-results/differential-status.txt
          exit "$((failures>0))"
      - name: Collect compiler/OS and static memory-order evidence
        shell: bash
        run: |
          mkdir -p safety-results
          clang --version > safety-results/toolchain.txt
          uname -a >> safety-results/toolchain.txt
          rg -n 'atomic_|memory_order|fork_detect_addr|fgn|CRYPTO_STATIC_MUTEX' \
            /tmp/awslc-patch/crypto/ube/fork_ube_detect.c > safety-results/atomic-source-lines.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-safety-batch
          path: safety-results/
